<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Org Design</title>
<link rel="icon" type="image/png" href="/kerv-one-favicon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/style.css"/>
<style>
  /* This page is a standalone diagram, not part of the app shell — override the app's fixed-height/hidden-overflow body */
  html,body{height:auto !important;overflow:auto !important}
  body{padding:28px 32px 80px}

  :root{
    --col-shared:    #F1F5F9;
    --col-api:       #EEF4FF;
    --col-platform:  #FDF0F4;
    --col-reporting: #F0FBF4;
  }

  .top-bar{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:28px}
  .top-bar img{width:26px;height:26px;flex-shrink:0}
  .top-bar-title{font-size:20px;font-weight:600;color:var(--text);letter-spacing:-.3px}
  .top-bar-sub{font-size:12px;color:var(--muted)}

  .charts-wrap{display:flex;align-items:flex-start;gap:0;width:max-content;min-width:100%}

  .divider{width:1px;align-self:stretch;background:var(--border-md);margin:0 28px;flex-shrink:0}

  .panel{width:1040px;flex-shrink:0}

  .section-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }

  .section-header{
    color:#fff;
    font-size:16px;
    font-weight:700;
    padding:14px 20px;
  }
  .section-header--product{background:var(--accent)}
  .section-header--technology{background:var(--secondary)}

  .grid{display:grid;grid-template-columns:110px repeat(4,1fr)}
  .grid > div:nth-child(3), .grid > div:nth-child(4), .grid > div:nth-child(5){
    border-left:1px dashed rgba(15,23,42,.12);
  }

  /* row label gutter */
  .glabel{
    display:flex;
    align-items:flex-start;
    padding:12px 12px 0;
    font-size:10px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--muted);
    background:var(--surface);
  }

  /* per-column info box: "Bounded Context" label + title + description */
  .bc-info-cell{padding:10px 8px 4px}
  .bc-info-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    height:100%;
    display:flex;
    flex-direction:column;
  }
  .bc-info-label{
    font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
    color:var(--faint);margin-bottom:6px;
  }
  .bc-info-body{display:flex;align-items:flex-start;gap:9px}
  .bc-info-title{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.3}
  .bc-info-sub{font-size:10.5px;font-weight:400;color:var(--muted);margin-top:2px;line-height:1.35;display:block}
  .bc-info-divider{height:1px;background:var(--border);margin:auto 0 9px}
  .bc-info-user{display:flex;justify-content:center}
  .bc-info-user svg{width:16px;height:16px;color:var(--muted)}

  .bc-icon{
    width:30px;height:30px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--subtle);color:var(--accent);
  }
  .bc-icon img{width:18px;height:18px;object-fit:contain}
  .bc-icon svg{width:16px;height:16px}

  /* icon rows */
  .row-cell{
    display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;
    gap:12px;padding:14px 10px;
  }
  .row-domsub .row-cell, .row-domsub .glabel{min-height:80px}
  .row-squad  .row-cell, .row-squad  .glabel{height:220px}

  /* compact domain cards — same family as bc-info-card, one hierarchy level down */
  .row-domsub .row-cell{
    display:flex;flex-wrap:nowrap;align-content:stretch;justify-content:flex-start;
    align-items:stretch;gap:6px;padding:10px;position:relative;
  }
  .domain-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:7px;
    padding:6px 7px;
    flex:1 1 0;
    min-width:0;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .domain-label{
    font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
    color:var(--faint);display:block;
  }
  .domain-title{font-size:9.5px;font-weight:600;color:var(--text);line-height:1.25;margin-top:1px}

  /* domain-owner icon + vertical spine reaching down into the Squads swimlane */
  .domain-divider{height:1px;background:var(--border);margin:auto 0 6px}
  .domain-icon{display:flex;justify-content:center}
  .domain-icon svg, .spine-icon svg{width:16px;height:16px;color:var(--muted)}
  .squad-spine{
    position:absolute;top:100%;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding-top:24px;
  }
  .squad-spine::before{
    content:'';position:absolute;top:0;left:50%;width:1px;height:24px;
    background:var(--border-md);transform:translateX(-50%);
  }

  .row-domsub .row-cell, .row-domsub .glabel{border-top:1px solid var(--border-md)}
  .row-squad  .row-cell, .row-squad  .glabel{border-top:1px solid var(--border-md)}

  .col-shared    { background:var(--col-shared); }
  .col-api       { background:var(--col-api); }
  .col-platform  { background:var(--col-platform); }
  .col-reporting { background:var(--col-reporting); }

</style>
</head>
<body>

<div class="top-bar">
  <img src="/kerv-one-favicon.png" alt="KERV"/>
  <div>
    <div class="top-bar-title">Org Design</div>
    <div class="top-bar-sub">Product &amp; Technology — bounded contexts</div>
  </div>
</div>

<div class="charts-wrap" id="chartsWrap"></div>

<script>
  var ICON_SHIELD =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>'
    + '</svg>';
  var ICON_SERVER =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + '<rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/>'
    + '<line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/>'
    + '</svg>';
  var ICON_CHART =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>'
    + '</svg>';
  var ICON_KERV = '<img src="/kerv-one-favicon.png" alt=""/>';

  var ICON_USER =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'
    + '</svg>';

  var COLUMNS = [
    { key:'shared',    name:'Shared Services',      sub:'Compliance, Security, IT and DevOps', icon:ICON_SHIELD, domains:[
        { title:'Security, Compliance e DevOps', spine:3 },
        { title:'IT Support', spine:1 }
      ] },
    { key:'api',       name:'API Suite',             sub:'Content, Live, Commerce, etc',        icon:ICON_SERVER, domains:[{ title:'Lorem Ipsum' }] },
    { key:'platform',  name:'KERV Platform',         sub:'',                                    icon:ICON_KERV,   domains:[{ title:'Lorem Ipsum' }, { title:'Lorem Ipsum' }, { title:'Lorem Ipsum' }] },
    { key:'reporting', name:'Reporting & Analytics', sub:'',                                    icon:ICON_CHART,  domains:[{ title:'Lorem Ipsum' }] }
  ];

  var LOREM = 'Lorem ipsum dolor sit amet';

  function panelHtml(title, headerClass) {
    var infoCells = COLUMNS.map(function(c) {
      return '<div class="bc-info-cell col-' + c.key + '">'
        + '<div class="bc-info-card">'
        +   '<div class="bc-info-label">Bounded Context</div>'
        +   '<div class="bc-info-body">'
        +     '<div class="bc-icon">' + c.icon + '</div>'
        +     '<div><div class="bc-info-title">' + c.name + '</div>'
        +     '<span class="bc-info-sub">' + (c.sub || LOREM) + '</span>'
        +     '</div>'
        +   '</div>'
        +   '<div class="bc-info-divider"></div>'
        +   '<div class="bc-info-user">' + ICON_USER + '</div>'
        + '</div>'
        + '</div>';
    }).join('');

    var domainCells = COLUMNS.map(function(c) {
      var cards = c.domains.map(function(d) {
        var spineHtml = '';
        if (d.spine > 1) {
          var extraIcons = '';
          for (var i = 1; i < d.spine; i++) extraIcons += '<div class="spine-icon">' + ICON_USER + '</div>';
          spineHtml = '<div class="squad-spine">' + extraIcons + '</div>';
        }
        return '<div class="domain-card">'
          + '<span class="domain-label">Domain</span>'
          + '<div class="domain-title">' + d.title + '</div>'
          + (d.spine ? '<div class="domain-divider"></div><div class="domain-icon">' + ICON_USER + '</div>' : '')
          + spineHtml
          + '</div>';
      }).join('');
      return '<div class="row-cell col-' + c.key + '">' + cards + '</div>';
    }).join('');

    function emptyRow() {
      return COLUMNS.map(function(c) {
        return '<div class="row-cell col-' + c.key + '"></div>';
      }).join('');
    }

    return '<div class="panel">'
      + '<div class="section-card">'
      +   '<div class="section-header ' + headerClass + '">' + title + '</div>'
      +   '<div class="grid">' + '<div></div>' + infoCells + '</div>'
      +   '<div class="grid row-domsub">'
      +     '<div class="glabel">Domain / Subdomain</div>' + domainCells
      +   '</div>'
      +   '<div class="grid row-squad">'
      +     '<div class="glabel">Squads</div>' + emptyRow()
      +   '</div>'
      + '</div>'
      + '</div>';
  }

  document.getElementById('chartsWrap').innerHTML =
    panelHtml('Product', 'section-header--product')
    + '<div class="divider"></div>'
    + panelHtml('Technology', 'section-header--technology');
</script>

</body>
</html>
